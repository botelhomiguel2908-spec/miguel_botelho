<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
        }

        h1,
        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .grupo {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 24px;
        }

        button:hover {
            background: #0b5ed7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th {
            background: #0d6efd;
            color: white;
        }

        table th,
        table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .aprovado {
            color: green;
            font-weight: bold;
        }

        .reprovado {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Lançamento de Notas</h1>

        <form id="formNotas">

            <div class="grupo">
                <label>Nome do Aluno</label>
                <input type="text" id="nome" required>
            </div>

            <div class="grupo">
                <label>Disciplina</label>
                <input type="text" id="disciplina" required>
            </div>

            <div class="grupo">
                <label>Nota 1</label>
                <input type="number" id="nota1" min="0" max="20" required>
            </div>

            <div class="grupo">
                <label>Nota 2</label>
                <input type="number" id="nota2" min="0" max="20" required>
            </div>

            <div class="grupo">
                <label>Nota 3</label>
                <input type="number" id="nota3" min="0" max="20" required>
            </div>

            <button type="submit">
                Salvar Nota
            </button>

        </form>
  <br>
        <hr>

      

        <h2>Lista de Notas</h2>

        <table>
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Disciplina</th>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                    <th>Nota 3</th>
                    <th>Média</th>
                    <th>Situação</th>
                </tr>
            </thead>

            <tbody id="tabelaNotas">

            </tbody>
        </table>

    </div>

    <script>
        const formulario = document.getElementById("formNotas");
        const tabela = document.getElementById("tabelaNotas");

        formulario.addEventListener("submit", function (e) {

            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const disciplina = document.getElementById("disciplina").value;

            const nota1 = Number(document.getElementById("nota1").value);
            const nota2 = Number(document.getElementById("nota2").value);
            const nota3 = Number(document.getElementById("nota3").value);

            const media = ((nota1 + nota2 + nota3) / 3).toFixed(1);

            const situacao =
                media >= 10
                    ? '<span class="aprovado">Aprovado</span>'
                    : '<span class="reprovado">Reprovado</span>';

            tabela.innerHTML += `
        <tr>
            <td>${nome}</td>
            <td>${disciplina}</td>
            <td>${nota1}</td>
            <td>${nota2}</td>
            <td>${nota3}</td>
            <td>${media}</td>
            <td>${situacao}</td>
        </tr>
    `;

            formulario.reset();
        });
    </script>

</body>

</html>
